<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Connect section with character pointing to social links">
  <defs>
    <style><![CDATA[
      @font-face {
        font-family: 'Space Grotesk';
        src: url(data:font/woff2;base64,) format('woff2');
        font-weight: 400 700;
        font-display: block;
      }
      .card { fill: #0f172a; stroke: #1e293b; rx: 16; filter: drop-shadow(0 4px 16px #000a); }
      .card-icon { filter: drop-shadow(0 0 8px currentColor); }
      .card-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #e2e8f0; dominant-baseline: middle; text-anchor: middle; }
      .card-desc { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 12px; fill: #64748b; dominant-baseline: middle; text-anchor: middle; }
      .arrow { fill: none; stroke: #a855f7; stroke-width: 3; stroke-dasharray: 10 8; opacity: 0.7; filter: drop-shadow(0 0 8px #a855f7); }
      @media (prefers-reduced-motion: reduce) {
        .char-float [animation], .arrow-draw [animation] { animation: none !important; }
      }
    ]]></style>
    <linearGradient id="card-gradient-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-gradient-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-gradient-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-violet" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#a855f7" flood-opacity="0.6" result="glow"/>
      <feComposite in="glow" in2="blur" operator="in"/>
      <feComposite in="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="#030712"/>
  <ellipse cx="200" cy="200" rx="250" ry="220" fill="url(#spotlight)"/>
  
  <g class="char-float" transform="translate(120, 200)">
    <image href="data:image/png;base64," x="-150" y="-200" width="300" height="400" preserveAspectRatio="xMidYMid meet"/>
    <animateTransform attributeName="transform" type="translate" values="120,200;120,192;120,200" dur="3s" repeatCount="indefinite" additive="sum"/>
    <g id="char-fallback" style="display:none;">
      <ellipse cx="0" cy="-50" rx="75" ry="100" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
      <circle cx="0" cy="-85" r="35" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
      <ellipse cx="0" cy="-40" rx="25" ry="15" fill="#a855f7" opacity="0.3"/>
      <path d="M50,25 Q100,0 125,-25" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
      <polygon points="125,-25 115,-19 115,-31" fill="#a855f7"/>
    </g>
  </g>
  
  <g class="arrow-draw" transform="translate(270, 200)">
    <path class="arrow" d="M0,0 Q100,-50 200,-50">
