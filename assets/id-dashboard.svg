<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700" role="img" aria-label="ID Dashboard with lanyard card">
  <defs>
    <style><![CDATA[
      @font-face {
        font-family: 'Space Grotesk';
        src: url(data:font/woff2;base64,) format('woff2');
        font-weight: 400 700;
        font-display: block;
      }
      .id-title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #e2e8f0; text-anchor: middle; dominant-baseline: middle; }
      .id-label { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 10px; fill: #64748b; text-anchor: start; dominant-baseline: middle; }
      .id-value { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #e2e8f0; text-anchor: start; dominant-baseline: middle; }
      .metric-label { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 9px; fill: #64748b; text-anchor: middle; dominant-baseline: middle; }
      .metric-value { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #a855f7; text-anchor: middle; dominant-baseline: middle; }
      .barcode-line { stroke: #1e293b; stroke-width: 1.5; }
      .foil-sweep { fill: url(#foil-gradient); opacity: 0; }
      @media (prefers-reduced-motion: reduce) {
        .card-group * [animation] { animation: none !important; }
        .foil-sweep { animation: none !important; opacity: 0.1 !important; }
      }
    ]]></style>
    <linearGradient id="card-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="foil-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="metal-shine" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feFlood flood-color="#cbd5e1" flood-opacity="0.3" result="shine"/>
      <feComposite in="shine" in2="blur" operator="in"/>
      <feComposite in="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="#030712"/>
  
  <g class="card-group" transform="translate(300, 350)">
    <!-- SMIL animations for drop-in and swing -->
    <animateTransform attributeName="transform" type="translate" values="300,150;300,350" dur="1.5s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <animateTransform attributeName="transform" type="rotate" values="0;1.7;0;-1.7;0" dur="4s" begin="2s" repeatCount="indefinite" additive="sum"/>
    
    <!-- Lanyard strap -->
    <rect x="-2" y="-200" width="4" height="200" fill="#1e293b" rx="2">
      <animate attributeName="height" values="0;200" dur="1s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </rect>
    <rect x="-2" y="-210" width="4" height="10" fill="url(#metal-gradient)" rx="2" filter="url(#metal-shine)"/>
    
    <!-- Metal clasp -->
    <g transform="translate(0, -210)">
      <ellipse cx="0" cy="0" rx="12" ry="8" fill="url(#metal-gradient)" filter="url(#metal-shine)"/>
      <ellipse cx="0" cy="0" rx="6" ry="4" fill="#0f172a"/>
      <rect x="-1" y="-4" width="2" height="8" fill="#334155"/>
    </g>
    
    <!-- ID Card -->
    <g transform="translate(0, -180)">
      <clipPath id="card-clip">
        <rect x="-120" y="-160" width="240" height="320" rx="16"/>
      </clipPath>
      
      <rect x="-120" y="-160" width="240" height="320" rx="16" fill="url(#card-gradient)" stroke="#334155" stroke-width="1.5" filter="url(#card-shadow)" clip-path="url(#card-clip)"/>
      
      <!-- Foil sweep -->
      <rect class="foil-sweep" x="-120" y="-160" width="100" height="320" rx="16" clip-path="url(#card-clip)">
        <animate attributeName="x" values="-220;340" dur="3s" repeatCount="indefinite" begin="2s" keyTimes="0;1"/>
        <animate attributeName="opacity" values="0;0.3;0" dur="3s" repeatCount="indefinite" begin="2s" keyTimes="0;0.5;1"/>
      </rect>
      
      <!-- Portrait -->
      <image href="data:image/png;base64,..." x="-80" y="-140" width="160" height="160" preserveAspectRatio="xMidYMid meet" clip-path="url(#card-clip)"/>
      
      <!-- Name -->
      <text class="id-title" x="0" y="35">Somen Bauri</text>
      
      <!-- Role -->
      <text class="id-label" x="-100" y="65">ROLE</text>
      <text class="id-value" x="-100" y="82">Student & Web Developer</text>
      
      <!-- Team -->
      <text class="id-label" x="-100" y="105">TEAM</text>
      <text class="id-value" x="-100" y="122">FTC Astrobot #22988</text>
      
      <!-- Robot -->
      <text class="id-label" x="-100" y="145">ROBOT</text>
      <text class="id-value" x="-100" y="162">Naagin</text>
      
      <!-- Barcode -->
      <g transform="translate(0, 180)">
        <g id="barcode">
          <line class="barcode-line" x1="-80" y1="0" x2="-80" y2="30"/>
          <line class="barcode-line" x1="-75" y1="0" x2="-75" y2="25"/>
          <line class="barcode-line" x1="-70" y1="0" x2="-70" y2="30"/>
          <line class="barcode-line" x1="-65" y1="0" x2="-65" y2="20"/>
          <line class="barcode-line" x1="-60" y1="0" x2="-60" y2="30"/>
          <line class="barcode-line" x1="-55" y1="0" x2="-55" y2="25"/>
          <line class="barcode-line" x1="-50" y1="0" x2="-50" y2="30"/>
          <line class="barcode-line" x1="-45" y1="0" x2="-45" y2="20"/>
          <line class="barcode-line" x1="-40" y1="0" x2="-40" y2="30"/>
          <line class="barcode-line" x1="-35" y1="0" x2="-35" y2="25"/>
          <line class="barcode-line" x1="-30" y1="0" x2="-30" y2="30"/>
          <line class="barcode-line" x1="-25" y1="0" x2="-25" y2="20"/>
          <line class="barcode-line" x1="-20" y1="0" x2="-20" y2="30"/>
          <line class="barcode-line" x1="-15" y1="0" x2="-15" y2="25"/>
          <line class="barcode-line" x1="-10" y1="0" x2="-10" y2="30"/>
          <line class="barcode-line" x1="-5" y1="0" x2="-5" y2="20"/>
          <line class="barcode-line" x1="0" y1="0" x2="0" y2="30"/>
          <line class="barcode-line" x1="5" y1="0" x2="5" y2="25"/>
          <line class="barcode-line" x1="10" y1="0" x2="10" y2="30"/>
          <line class="barcode-line" x1="15" y1="0" x2="15" y2="20"/>
          <line class="barcode-line" x1="20" y1="0" x2="20" y2="30"/>
          <line class="barcode-line" x1="25" y1="0" x2="25" y2="25"/>
          <line class="barcode-line" x1="30" y1="0" x2="30" y2="30"/>
          <line class="barcode-line" x1="35" y1="0" x2="35" y2="20"/>
          <line class="barcode-line" x1="40" y1="0" x2="40" y2="30"/>
          <line class="barcode-line" x1="45" y1="0" x2="45" y2="25"/>
          <line class="barcode-line" x1="50" y1="0" x2="50" y2="30"/>
          <line class="barcode-line" x1="55" y1="0" x2="55" y2="20"/>
          <line class="barcode-line" x1="60" y1="0" x2="60" y2="30"/>
          <line class="barcode-line" x1="65" y1="0" x2="65" y2="25"/>
          <line class="barcode-line" x1="70" y1="0" x2="70" y2="30"/>
          <line class="barcode-line" x1="75" y1="0" x2="75" y2="20"/>
        </g>
      </g>
      
      <!-- Verified metrics -->
      <g transform="translate(0, 230)">
        <g transform="translate(-100, 0)">
          <text class="metric-value">1</text>
          <text class="metric-label" y="20">Portfolio</text>
        </g>
        <g transform="translate(0, 0)">
          <text class="metric-value">16</text>
          <text class="metric-label" y="20">Pages</text>
        </g>
        <g transform="translate(100, 0)">
          <text class="metric-value">2024</text>
          <text class="metric-label" y="20">Completed</text>
        </g>
      </g>
    </g>
  </g>
</svg>