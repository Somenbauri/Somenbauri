    </path>
    <path class="arrow" d="M0,0 Q100,0 200,0">
      <animate attributeName="stroke-dashoffset" values="24;-24;24" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </path>
    <path class="arrow" d="M0,0 Q100,50 200,50">
      <animate attributeName="stroke-dashoffset" values="24;-24;24" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </path>
  </g>
  
  <g transform="translate(500, 50)">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="530,50;500,50" dur="0.6s" begin="0.1s" fill="freeze" additive="sum"/>
      <rect class="card" x="0" y="0" width="280" height="120" rx="16"/>
      <rect x="0" y="0" width="280" height="120" rx="16" fill="url(#card-gradient-1)"/>
      <circle class="card-icon" cx="140" cy="35" r="24" fill="#0A66C2"/>
      <path class="card-icon" d="M126,35 L121,30 L121,40 Z M131,30 L131,40 M136,30 L136,40 M141,35 L146,30 L146,40 Z" fill="white" stroke-width="0.5"/>
      <text class="card-title" x="140" y="75">LinkedIn</text>
      <text class="card-desc" x="140" y="95">somen-bauri-3a801a442</text>
      <a href="https://www.linkedin.com/in/somen-bauri-3a801a442" target="_blank" rel="noopener">
        <rect x="0" y="0" width="280" height="120" rx="16" fill="transparent"/>
      </a>
    </g>
    
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.25s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="530,190;500,190" dur="0.6s" begin="0.25s" fill="freeze" additive="sum"/>
      <rect class="card" x="0" y="0" width="280" height="120" rx="16"/>
      <rect x="0" y="0" width="280" height="120" rx="16" fill="url(#card-gradient-2)"/>
      <circle class="card-icon" cx="140" cy="35" r="24" fill="#181717"/>
      <path class="card-icon" d="M140,17 C153.8,17 165,28.2 165,42 C165,57.5 155,70 135,80 C135,71 135,73 135,74 C135,76 133,78 131,78 C126,78 122,75 122,70 C102,60 92,47.5 92,32 C92,17.8 103.2,17 127,17 C128.5,17 130,17.1 131.5,17.1 L131.5,17 Z M131.5,17 C133,17 134.5,17.1 136,17.1 L136,17 C137.5,17 139,16.9 140.5,16.9 L140.5,17 C142,17 143.5,17.1 145,17.1 L145,17 C146.5,17 148,16.9 149.5,16.9 L149.5,17 C151,17 152.5,17.1 154,17.1 L154,17 C155.5,17 157,16.9 158.5,16.9 L158.5,17 C160,17 161.5,17.1 163,17.1 L163,17 C164.5,17 166,16.9 167.5,16.9 L167.5,17 C169,17 170.5,17.1 172,17.1 L172,17 C173.5,17 175,16.9 176.5,16.9 L176.5,17 C178,17 179.5,17.1 181,17.1 L181,17" fill="white" transform="scale(0.4) translate(50, 30)"/>
      <text class="card-title" x="140" y="75">GitHub</text>
      <text class="card-desc" x="140" y="95">Somenbauri</text>
      <a href="https://github.com/Somenbauri" target="_blank" rel="noopener">
        <rect x="0" y="0" width="280" height="120" rx="16" fill="transparent"/>
      </a>
    </g>
    
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="530,330;500,330" dur="0.6s" begin="0.4s" fill="freeze" additive="sum"/>
      <rect class="card" x="0" y="0" width="280" height="120" rx="16"/>
      <rect x="0" y="0" width="280" height="120" rx="16" fill="url(#card-gradient-3)"/>
      <circle class="card-icon" cx="140" cy="35" r="24" fill="#D14836"/>
      <path class="card-icon" d="M84,28 L140,55 L196,28 L196,82 L84,82 Z M84,28 L140,63 L196,28" fill="none" stroke="white" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <text class="card-title" x="140" y="75">Email</text>
      <text class="card-desc" x="140" y="95">somenbauri.dev@gmail.com</text>
      <a href="mailto:somenbauri.dev@gmail.com" target="_blank" rel="noopener">
        <rect x="0" y="0" width="280" height="120" rx="16" fill="transparent"/>
      </a>
    </g>
  </g>
  
  <text x="600" y="40" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0" text-anchor="middle">LET'S CONNECT</text>
  <text x="600" y="65" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Click cards to open • Links also below in README</text>
</svg>